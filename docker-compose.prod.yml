# Production overrides (docs/runbook.md, "Deployment"):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from development:
#   * immutable images (target prod / web), no source bind mount
#   * configuration from .env injected as environment (no .env in the image)
#   * storage and the backup spool on named volumes
#   * nginx listens on 127.0.0.1 only: TLS terminates on the reverse proxy /
#     load balancer in front (set TRUSTED_PROXIES); HTTPS is enforced by the API
#   * no database port on the host, archive and backups on real off-server S3

x-prod-app: &prod-app
  build:
    context: .
    dockerfile: Dockerfile
    target: prod
  image: ${APP_IMAGE:-audit-log-platform/app}:${APP_IMAGE_TAG:-latest}
  env_file: .env
  environment:
    # backup:run --type=app includes this file (read-only mount below).
    BACKUP_ENV_FILE: /etc/audit/.env
  volumes: !override
    - app-storage:/var/www/html/storage
    - backup-spool:/var/www/html/storage/app/backup-spool
    - ./.env:/etc/audit/.env:ro

services:
  # The web-facing container gets only what it needs (security review M5):
  # no root, archiver or backup database passwords and no copy of .env.
  # Retention, archiving and the app-files backup run in the scheduler and
  # queue-worker, which keep them.
  app:
    <<: *prod-app
    environment: !override
      CONTAINER_ROLE: app
      DB_ROOT_PASSWORD: ""
      DB_ARCHIVER_PASSWORD: ""
      DB_BACKUP_PASSWORD: ""
    volumes: !override
      - app-storage:/var/www/html/storage
      - backup-spool:/var/www/html/storage/app/backup-spool

  queue-worker:
    <<: *prod-app

  scheduler:
    <<: *prod-app

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${WEB_IMAGE:-audit-log-platform/web}:${APP_IMAGE_TAG:-latest}
    volumes: !reset []
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:80"

  mariadb:
    ports: !reset []

  backup:
    volumes: !override
      - mariadb-data:/var/lib/mysql:ro
      - backups:/backups
      - backup-spool:/spool


volumes:
  app-storage:
  backup-spool:
