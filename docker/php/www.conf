; Overrides for the default php-fpm pool.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Used by the container healthcheck (cgi-fcgi ... /ping -> pong).
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
