# Audit Log Platform - local / dev stack.
#
#   ./bin/setup                      first run (build, install, migrate, seed)
#   docker compose up -d             afterwards
#
# Services: app (PHP-FPM), nginx, mariadb, redis, queue-worker (Horizon),
# scheduler and backup (mariadb-backup + age + rclone). In development the
# archive and backups stay on local disk; production points them at S3.

name: audit-log-platform

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: ${APP_BUILD_TARGET:-dev}
  image: audit-log-platform/app:${APP_IMAGE_TAG:-dev}
  # Laravel reads .env from the bind-mounted source, so edits to .env and
  # `php artisan key:generate` take effect without recreating containers.
  volumes:
    - ./:/var/www/html
  restart: unless-stopped
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      # composer install may run in the entrypoint on a fresh clone
      start_period: 300s
      start_interval: 5s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      # The image's own user is the maintenance (DDL) account; the init
      # script adds the least-privilege runtime account DB_USERNAME.
      MARIADB_USER: ${DB_MAINTENANCE_USERNAME:-audit_maintenance}
      MARIADB_PASSWORD: ${DB_MAINTENANCE_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-audit_testing}
      DB_ARCHIVER_USERNAME: ${DB_ARCHIVER_USERNAME}
      DB_ARCHIVER_PASSWORD: ${DB_ARCHIVER_PASSWORD}
      DB_BACKUP_USERNAME: ${DB_BACKUP_USERNAME}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue-worker:
    <<: *app
    # Horizon supervises the ingest and default workers (config/horizon.php).
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    # Archive/prune can take minutes: let them finish instead of being killed
    # (a killed task leaves its overlap lock behind).
    stop_grace_period: 120s
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: audit-log-platform/backup:${APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    command: ["schedule"]
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_DATABASE}
      DB_BACKUP_USERNAME: ${DB_BACKUP_USERNAME}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
      FULL_BACKUP_HOUR: ${BACKUP_FULL_HOUR:-2}
      RESTORE_TEST_WEEKDAY: ${BACKUP_RESTORE_TEST_WEEKDAY:-5}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      # rclone remote "offsite" defined from environment variables (used only when BACKUP_RCLONE_REMOTE is set, e.g. S3 in prod).
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-AWS}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${AWS_ENDPOINT:-}
    volumes:
      - mariadb-data:/var/lib/mysql:ro
      - backups:/backups
      # Shared with the app: manual run requests in, status + reports out.
      - ./storage/app/backup-spool:/spool
      # Development stand-in for the off-site storage: BACKUP_RCLONE_REMOTE=/offsite
      # (a separate volume, so `make offsite-drill` can be practised for free).
      - offsite-sim:/offsite
    depends_on:
      mariadb:
        condition: service_healthy

  # Development identity provider for SAML single sign-on (decision D15).
  # Not started by default: `make sso` (profile "sso"). Admin console:
  # http://localhost:8180 (admin / admin), realm "audit", demo users
  # *@demo.test with password Demo-SSO-2026!. Development only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["sso"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./docker/keycloak/realm-audit.json:/opt/keycloak/data/import/realm-audit.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  offsite-sim:
  mariadb-data:
  redis-data:
  backups:
