# Audit Log Platform - local / dev stack.
#
#   ./bin/setup                      first run (build, install, migrate, seed)
#   docker compose up -d             afterwards
#
# Services: app (PHP-FPM), nginx, mariadb, redis, queue-worker (Horizon),
# scheduler, backup (mariadb-backup + age + rclone) and minio (S3-compatible
# off-site storage for the archive and the backups in development).

name: audit-log-platform

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: ${APP_BUILD_TARGET:-dev}
  image: audit-log-platform/app:${APP_IMAGE_TAG:-dev}
  # Laravel reads .env from the bind-mounted source, so edits to .env and
  # `php artisan key:generate` take effect without recreating containers.
  volumes:
    - ./:/var/www/html
  restart: unless-stopped
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      # composer install may run in the entrypoint on a fresh clone
      start_period: 300s
      start_interval: 5s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      # The image's own user is the maintenance (DDL) account; the init
      # script adds the least-privilege runtime account DB_USERNAME.
      MARIADB_USER: ${DB_MAINTENANCE_USERNAME:-audit_maintenance}
      MARIADB_PASSWORD: ${DB_MAINTENANCE_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-audit_testing}
      DB_ARCHIVER_USERNAME: ${DB_ARCHIVER_USERNAME}
      DB_ARCHIVER_PASSWORD: ${DB_ARCHIVER_PASSWORD}
      DB_BACKUP_USERNAME: ${DB_BACKUP_USERNAME}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue-worker:
    <<: *app
    # Horizon supervises the ingest/default/maintenance workers (config/horizon.php).
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: audit-log-platform/backup:${APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    command: ["schedule"]
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_DATABASE}
      DB_BACKUP_USERNAME: ${DB_BACKUP_USERNAME}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
      FULL_BACKUP_HOUR: ${BACKUP_FULL_HOUR:-2}
      RESTORE_TEST_WEEKDAY: ${BACKUP_RESTORE_TEST_WEEKDAY:-5}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      # rclone remote "offsite" defined from environment variables (MinIO in dev, S3 in prod).
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Minio}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${AWS_ENDPOINT:-}
    volumes:
      - mariadb-data:/var/lib/mysql:ro
      - backups:/backups
      # Shared with the app: manual run requests in, status + reports out.
      - ./storage/app/backup-spool:/spool
    depends_on:
      mariadb:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me-minio}
    ports:
      - "127.0.0.1:${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the archive and backup buckets (versioned, so an
  # overwritten or deleted object can still be recovered).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID:-minio}:${AWS_SECRET_ACCESS_KEY:-change-me-minio}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc mb --ignore-existing local/${AUDIT_ARCHIVE_BUCKET:-audit-archive} &&
        mc mb --ignore-existing local/${BACKUP_BUCKET:-audit-backups} &&
        mc version enable local/${AUDIT_ARCHIVE_BUCKET:-audit-archive} &&
        mc version enable local/${BACKUP_BUCKET:-audit-backups}

volumes:
  mariadb-data:
  redis-data:
  backups:
  minio-data:
