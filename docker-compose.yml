# Audit Log Platform - local / dev stack.
#
#   cp .env.docker.example .env   (bin/setup does this for you)
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
#
# Services: app (PHP-FPM), nginx, mariadb, redis, queue-worker, scheduler,
# backup (enabled with: docker compose --profile backup up -d).

name: audit-log-platform

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: ${APP_BUILD_TARGET:-dev}
  image: audit-log-platform/app:${APP_IMAGE_TAG:-dev}
  # Laravel reads .env from the bind-mounted source, so edits to .env and
  # `php artisan key:generate` take effect without recreating containers.
  volumes:
    - ./:/var/www/html
  restart: unless-stopped
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      # composer install may run in the entrypoint on a fresh clone
      start_period: 300s
      start_interval: 5s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-audit_testing}
      DB_ARCHIVER_USERNAME: ${DB_ARCHIVER_USERNAME}
      DB_ARCHIVER_PASSWORD: ${DB_ARCHIVER_PASSWORD}
      DB_BACKUP_USERNAME: ${DB_BACKUP_USERNAME}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue-worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=ingest,default", "--tries=5", "--backoff=10", "--max-time=3600"]
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: mariadb:11.8
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/backup.sh"]
    command: ["schedule"]
    environment:
      DB_HOST: mariadb
      DB_BACKUP_USERNAME: ${DB_BACKUP_USERNAME}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
      FULL_BACKUP_HOUR: ${BACKUP_FULL_HOUR:-2}
    volumes:
      - mariadb-data:/var/lib/mysql:ro
      - backups:/backups
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q backup.sh /proc/1/cmdline || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  mariadb-data:
  redis-data:
  backups:
